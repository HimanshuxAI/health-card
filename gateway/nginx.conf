limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

# Docker's embedded DNS. Upstreams are resolved per request (not cached at
# startup) so a recreated service container never leaves the gateway pointing
# at a stale IP.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Start $msec;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;

    # /api/<service>/<path> -> http://<service>:8000/<path>
    location ~ ^/api/(identity|records|abdm|nhcx|sos)/(?<rest>.*)$ {
        limit_req zone=api burst=100 nodelay;
        set $svc $1;
        set $rest $rest;
        proxy_pass http://$svc:8000/$rest$is_args$args;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
