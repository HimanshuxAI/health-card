limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

server {
    listen 80;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Start $msec;

    location /api/identity/ {
        limit_req zone=api burst=100 nodelay;
        rewrite ^/api/identity/(.*)$ /$1 break;
        proxy_pass http://identity:8000;
    }

    location /api/records/ {
        limit_req zone=api burst=100 nodelay;
        rewrite ^/api/records/(.*)$ /$1 break;
        proxy_pass http://records:8000;
    }

    location /api/abdm/ {
        limit_req zone=api burst=100 nodelay;
        rewrite ^/api/abdm/(.*)$ /$1 break;
        proxy_pass http://abdm:8000;
    }

    location /api/nhcx/ {
        limit_req zone=api burst=100 nodelay;
        rewrite ^/api/nhcx/(.*)$ /$1 break;
        proxy_pass http://nhcx:8000;
    }

    location /api/sos/ {
        limit_req zone=api burst=100 nodelay;
        rewrite ^/api/sos/(.*)$ /$1 break;
        proxy_pass http://sos:8000;
    }

    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
