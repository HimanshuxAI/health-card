# Deployment compose: pulls prebuilt images from GitHub Container Registry
# instead of building on the host. Images are published by
# .github/workflows/publish.yml on every push to main.
#
#   docker compose -f docker-compose.ghcr.yml up -d
#
# Pin a specific build with ABHA_TAG:
#
#   ABHA_TAG=<git-sha> docker compose -f docker-compose.ghcr.yml up -d
#
# The SQLite databases live in the named volume "abha-data" and survive
# container replacement. Seed the demo data once with:
#
#   docker compose -f docker-compose.ghcr.yml run --rm seed python scripts/seed.py --reset

name: health-card

x-service-env: &service-env
  JWT_SECRET: ${JWT_SECRET:-demo-secret-change-me}
  SHARED_TOKEN: ${SHARED_TOKEN:-internal-demo-token}

x-service-common: &service-common
  image: ghcr.io/${GHCR_OWNER:-himanshuxai}/health-card-services:${ABHA_TAG:-latest}
  working_dir: /srv/services
  environment: *service-env
  volumes:
    - abha-data:/data
  restart: unless-stopped

services:
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - identity
      - records
      - abdm
      - nhcx
      - sos
      - frontend
    restart: unless-stopped

  frontend:
    image: ghcr.io/${GHCR_OWNER:-himanshuxai}/health-card-frontend:${ABHA_TAG:-latest}
    environment:
      API_GATEWAY_URL: http://gateway:80
      NEXT_PUBLIC_API_BASE: ""
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    restart: unless-stopped

  seed:
    image: ghcr.io/${GHCR_OWNER:-himanshuxai}/health-card-services:${ABHA_TAG:-latest}
    command: python scripts/seed.py
    working_dir: /srv
    environment:
      <<: *service-env
      IDENTITY_DB: /data/identity.db
      RECORDS_DB: /data/records.db
      ABDM_DB: /data/abdm.db
      NHCX_DB: /data/nhcx.db
      SOS_DB: /data/sos.db
    volumes:
      - abha-data:/data
    depends_on:
      identity:
        condition: service_healthy
      records:
        condition: service_healthy
      abdm:
        condition: service_healthy
      nhcx:
        condition: service_healthy
      sos:
        condition: service_healthy
    restart: "no"

  identity:
    <<: *service-common
    command: uvicorn identity_app.main:app --host 0.0.0.0 --port 8000
    working_dir: /srv/services/identity
    environment:
      <<: *service-env
      IDENTITY_DB: /data/identity.db
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 10

  records:
    <<: *service-common
    command: uvicorn records_app.main:app --host 0.0.0.0 --port 8000
    working_dir: /srv/services/records
    environment:
      <<: *service-env
      RECORDS_DB: /data/records.db
      IDENTITY_URL: http://identity:8000
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 10

  abdm:
    <<: *service-common
    command: uvicorn abdm_app.main:app --host 0.0.0.0 --port 8000
    working_dir: /srv/services/abdm
    environment:
      <<: *service-env
      ABDM_DB: /data/abdm.db
    ports:
      - "8003:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 10

  nhcx:
    <<: *service-common
    command: uvicorn nhcx_app.main:app --host 0.0.0.0 --port 8000
    working_dir: /srv/services/nhcx
    environment:
      <<: *service-env
      NHCX_DB: /data/nhcx.db
      ABDM_URL: http://abdm:8000
    ports:
      - "8004:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 10

  sos:
    <<: *service-common
    command: uvicorn sos_app.main:app --host 0.0.0.0 --port 8000
    working_dir: /srv/services/sos
    environment:
      <<: *service-env
      SOS_DB: /data/sos.db
      RECORDS_URL: http://records:8000
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SOS_FROM_EMAIL: ${SOS_FROM_EMAIL:-}
    ports:
      - "8005:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 10

volumes:
  abha-data:
