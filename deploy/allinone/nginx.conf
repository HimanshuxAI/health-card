limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Everything runs in one container, so every upstream is on the loopback
# address and no name resolution is involved.
upstream identity_svc {
    server 127.0.0.1:8001;
}
upstream records_svc {
    server 127.0.0.1:8002;
}
upstream abdm_svc {
    server 127.0.0.1:8003;
}
upstream nhcx_svc {
    server 127.0.0.1:8004;
}
upstream sos_svc {
    server 127.0.0.1:8005;
}

server {
    # Replaced with the port the host asks for by deploy/allinone/entrypoint.sh.
    # Hosts like Render choose the port and pass it in PORT; the default keeps
    # the container working when nothing is set.
    listen __PORT__;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Start $msec;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;

    # /api/<service>/<path> -> http://127.0.0.1:800X/<path>
    location ~ ^/api/identity/(?<rest>.*)$ {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://identity_svc/$rest$is_args$args;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    location ~ ^/api/records/(?<rest>.*)$ {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://records_svc/$rest$is_args$args;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    location ~ ^/api/abdm/(?<rest>.*)$ {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://abdm_svc/$rest$is_args$args;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    location ~ ^/api/nhcx/(?<rest>.*)$ {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://nhcx_svc/$rest$is_args$args;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    location ~ ^/api/sos/(?<rest>.*)$ {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://sos_svc/$rest$is_args$args;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
