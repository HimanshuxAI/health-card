; Runs the whole stack inside one container, for hosts that give a single
; service and a single volume instead of a compose file.
;
; Startup order is set by priority: the seed runs first, then the five API
; services and the frontend, then nginx, which is the only public port.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:seed]
priority=10
directory=/srv
command=python scripts/seed.py
; The seed is idempotent and every service prints "already seeded" after the
; first run, so this is safe on every container start.
autorestart=false
startsecs=0
exitcodes=0
environment=PYTHONPATH="/srv/services:/srv",IDENTITY_DB="/data/identity.db",RECORDS_DB="/data/records.db",ABDM_DB="/data/abdm.db",NHCX_DB="/data/nhcx.db",SOS_DB="/data/sos.db"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:identity]
priority=20
directory=/srv/services/identity
command=uvicorn identity_app.main:app --host 127.0.0.1 --port 8001
environment=PYTHONPATH="/srv/services:/srv",IDENTITY_DB="/data/identity.db"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:records]
priority=20
directory=/srv/services/records
command=uvicorn records_app.main:app --host 127.0.0.1 --port 8002
environment=PYTHONPATH="/srv/services:/srv",RECORDS_DB="/data/records.db",IDENTITY_URL="http://127.0.0.1:8001"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:abdm]
priority=20
directory=/srv/services/abdm
command=uvicorn abdm_app.main:app --host 127.0.0.1 --port 8003
environment=PYTHONPATH="/srv/services:/srv",ABDM_DB="/data/abdm.db"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nhcx]
priority=20
directory=/srv/services/nhcx
command=uvicorn nhcx_app.main:app --host 127.0.0.1 --port 8004
environment=PYTHONPATH="/srv/services:/srv",NHCX_DB="/data/nhcx.db",ABDM_URL="http://127.0.0.1:8003"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:sos]
priority=20
directory=/srv/services/sos
command=uvicorn sos_app.main:app --host 127.0.0.1 --port 8005
environment=PYTHONPATH="/srv/services:/srv",SOS_DB="/data/sos.db",RECORDS_URL="http://127.0.0.1:8002",SMTP_HOST="",SMTP_PORT="587",SMTP_USER="",SMTP_PASS="",SOS_FROM_EMAIL=""
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
priority=20
directory=/srv/frontend
command=node server.js
environment=NODE_ENV="production",NEXT_TELEMETRY_DISABLED="1",HOSTNAME="127.0.0.1",PORT="3000"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gateway]
priority=30
command=nginx -g "daemon off;"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
