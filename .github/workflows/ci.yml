name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit and integration tests
        run: python -m pytest

  end-to-end:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start the five services
        run: |
          while read -r name port module; do
            (
              cd services/$name
              PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/services" \
                nohup python -m uvicorn "$module:app" --host 127.0.0.1 --port "$port" >"$RUNNER_TEMP/$name.log" 2>&1 &
            )
          done <<'EOF'
          identity 8001 identity_app.main
          records 8002 records_app.main
          abdm 8003 abdm_app.main
          nhcx 8004 nhcx_app.main
          sos 8005 sos_app.main
          EOF
          sleep 12
          for port in 8001 8002 8003 8004 8005; do
            curl -fsS "http://127.0.0.1:$port/health" || { cat "$RUNNER_TEMP"/*.log; exit 1; }
          done

      - name: Seed demo data
        run: python scripts/seed.py

      - name: Run the smoke test
        run: python scripts/e2e.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate route types
        working-directory: frontend
        run: npx next typegen

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Production build
        working-directory: frontend
        run: npm run build

  images:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          build-args: |
            API_GATEWAY_URL=http://gateway:80
          push: false
          tags: health-card-frontend:ci

      - name: Build the services image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/Dockerfile.service
          push: false
          tags: health-card-services:ci
